<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 864 196" width="864" height="196" role="img" aria-label="Myrlin Workbook">
  <!--
    Myrlin Workbook horizontal lockup, for dark grounds (GitHub dark README, dark site header).
    Wordmark ink is #F0EFED, the app's own primary text token in dark.

    The mark carries the lifted purple ramp, not the resting one. WHY: at #35164B the
    crown's shadow face sits at 1.2:1 against GitHub's #0d1117 and the right half of the
    silhouette simply disappears. #7E63A0 body over #2A1440 keyline puts the body at
    3.8:1 against that ground and keeps the keyline readable against the body at 3.3:1.
    Same hue family, same relationships, one stop brighter.

    Geometry is identical to logo-lockup-light.svg and to logo.svg's #hat-core; only the
    fills differ. #hat-detail is left out at header sizes for the same reason as the light
    lockup. Measured widths and the viewBox headroom rationale: see the light lockup.
  -->
  <defs>
    <clipPath id="myrlin-ld-brim"><use href="#ld-brim"/></clipPath>
    <clipPath id="myrlin-ld-crown"><use href="#ld-crown"/></clipPath>
    <clipPath id="myrlin-ld-tip"><use href="#ld-tip"/></clipPath>
  </defs>

  <g transform="translate(14 10) scale(0.35)">
    <path id="ld-brim" fill="#7E63A0" stroke="#2A1440" stroke-width="9" stroke-linejoin="round"
          d="M152 355c-26 11-64 31-94 50L40 418c6 10 24 18 48 23 14 3 22 3 28 1 16 4 42 10 72 14 14 2 26 2 40 0 42-5 86-12 126-18 20-3 32-1 40 4 16 2 36-2 56-10L470 418c-14-16-48-36-80-48-12-5-20-11-26-15Z"/>
    <g clip-path="url(#myrlin-ld-brim)">
      <path fill="#B5A0CC" d="M16 384c58 36 134 56 250 62v40H16Z"/>
      <path fill="#4A2668" d="M338 336c20 38 26 72 14 108h150V336Z"/>
      <path fill="#B5A0CC" d="M300 438c16-22 44-31 72-25-6 17-28 29-72 25Z"/>
    </g>
    <path id="ld-crown" fill="#7E63A0" stroke="#2A1440" stroke-width="9" stroke-linejoin="round"
          d="M300 44c-14 12-44 26-60 36-12 7-19 19-20 41Q178 238 152 355h212c-14-55-32-123-48-183-5-18-4-33 0-48Z"/>
    <g clip-path="url(#myrlin-ld-crown)">
      <path fill="#B5A0CC" d="M300 44 246 118 180 372h-70V44Z"/>
      <path fill="#4A2668" d="M266 84c10 56 32 146 58 288h80V84Z"/>
    </g>
    <path id="ld-tip" fill="#7E63A0" stroke="#2A1440" stroke-width="9" stroke-linejoin="round"
          d="M300 44c14 14 38 40 56 74 12 22 20 42 20 60v12c0 12-1 19-3 23-11-14-24-35-34-55-8-16-16-27-23-34Z"/>
    <g clip-path="url(#myrlin-ld-tip)">
      <path fill="#4A2668" d="M288 102 400 148v134H288Z"/>
      <path fill="#B5A0CC" d="M302 46c26 14 48 36 62 62l-14 8c-14-26-34-48-58-62Z"/>
    </g>
    <path fill="#5DF3BE" stroke="#2A1440" stroke-width="7" stroke-linejoin="round"
          d="M156 334c64-8 140-8 202-3 2 12 3 23 2 32-64 10-142 9-208-2 0-9 2-19 4-27Z"/>
    <path fill="#39C899" d="M153 351c66 11 143 12 206 2l1 10c-64 10-142 9-208-2Z"/>
    <rect x="237" y="141" width="50" height="50" rx="9" transform="rotate(-7 262 166)"
          fill="#5DF3BE" stroke="#2A1440" stroke-width="6"/>
    <rect x="194" y="254" width="56" height="56" rx="10" transform="rotate(6 222 282)"
          fill="#5DF3BE" stroke="#2A1440" stroke-width="6"/>
  </g>

  <text x="229" y="127" fill="#F0EFED" font-size="76" font-weight="600" letter-spacing="-1.1"
        font-family="'Plus Jakarta Sans', ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Display', 'Segoe UI', Helvetica, Arial, sans-serif">Myrlin Workbook</text>
</svg>
