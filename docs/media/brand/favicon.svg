<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Myrlin Workbook">
  <!--
    Myrlin Workbook favicon.
    Same core geometry as logo.svg, byte for byte on the four silhouette paths, but
    #hat-detail (stitching, buckle, creases) is dropped: below about 48px those shapes
    fill in and turn the crown to mud. The group is also scaled up slightly, because a
    favicon is cropped by the tab, not by a page, so it wants less padding than the master.

    Colour: the light values are presentation attributes, so the mark still renders in
    any consumer with no CSS support at all. The dark values live in the media query
    only. They exist because the resting body purple #5A437A sits at 2.2:1 against the
    app's dark ground #191919, which is too dark to read in a tab strip; the lifted
    #7E63A0 sits at 3.5:1. See docs/media/brand/README.md.
  -->
  <style>
    @media (prefers-color-scheme: dark) {
      .b { fill: #7E63A0 }
      .l { fill: #B5A0CC }
      .s { fill: #4A2668 }
      .m { fill: #5DF3BE }
      .ms { fill: #39C899 }
      .e { stroke: #2A1440 }
    }
  </style>
  <defs>
    <clipPath id="myrlin-fav-clip-brim"><use href="#fav-brim"/></clipPath>
    <clipPath id="myrlin-fav-clip-crown"><use href="#fav-crown"/></clipPath>
    <clipPath id="myrlin-fav-clip-tip"><use href="#fav-tip"/></clipPath>
  </defs>

  <g transform="translate(256 256) scale(1.06) translate(-256 -256)">
    <path id="fav-brim" class="b e" fill="#5A437A" stroke="#221033" stroke-width="9" stroke-linejoin="round"
          d="M152 355c-26 11-64 31-94 50L40 418c6 10 24 18 48 23 14 3 22 3 28 1 16 4 42 10 72 14 14 2 26 2 40 0 42-5 86-12 126-18 20-3 32-1 40 4 16 2 36-2 56-10L470 418c-14-16-48-36-80-48-12-5-20-11-26-15Z"/>
    <g clip-path="url(#myrlin-fav-clip-brim)">
      <path class="l" fill="#8E76A9" d="M16 384c58 36 134 56 250 62v40H16Z"/>
      <path class="s" fill="#35164B" d="M338 336c20 38 26 72 14 108h150V336Z"/>
      <path class="l" fill="#8E76A9" d="M300 438c16-22 44-31 72-25-6 17-28 29-72 25Z"/>
    </g>

    <path id="fav-crown" class="b e" fill="#5A437A" stroke="#221033" stroke-width="9" stroke-linejoin="round"
          d="M300 44c-14 12-44 26-60 36-12 7-19 19-20 41Q178 238 152 355h212c-14-55-32-123-48-183-5-18-4-33 0-48Z"/>
    <g clip-path="url(#myrlin-fav-clip-crown)">
      <path class="l" fill="#8E76A9" d="M300 44 246 118 180 372h-70V44Z"/>
      <path class="s" fill="#35164B" d="M266 84c10 56 32 146 58 288h80V84Z"/>
    </g>

    <path id="fav-tip" class="b e" fill="#5A437A" stroke="#221033" stroke-width="9" stroke-linejoin="round"
          d="M300 44c14 14 38 40 56 74 12 22 20 42 20 60v12c0 12-1 19-3 23-11-14-24-35-34-55-8-16-16-27-23-34Z"/>
    <g clip-path="url(#myrlin-fav-clip-tip)">
      <path class="s" fill="#35164B" d="M288 102 400 148v134H288Z"/>
      <path class="l" fill="#8E76A9" d="M302 46c26 14 48 36 62 62l-14 8c-14-26-34-48-58-62Z"/>
    </g>

    <path id="fav-band" class="m e" fill="#4BEDB3" stroke="#221033" stroke-width="7" stroke-linejoin="round"
          d="M156 334c64-8 140-8 202-3 2 12 3 23 2 32-64 10-142 9-208-2 0-9 2-19 4-27Z"/>
    <path class="ms" fill="#2CBA8B" d="M153 351c66 11 143 12 206 2l1 10c-64 10-142 9-208-2Z"/>

    <rect class="m e" x="237" y="141" width="50" height="50" rx="9" transform="rotate(-7 262 166)"
          fill="#4BEDB3" stroke="#221033" stroke-width="6"/>
    <rect class="m e" x="194" y="254" width="56" height="56" rx="10" transform="rotate(6 222 282)"
          fill="#4BEDB3" stroke="#221033" stroke-width="6"/>
  </g>
</svg>
