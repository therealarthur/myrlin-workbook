<!doctype html>
<meta charset="utf-8">
<title>Myrlin Workbook logo reveal</title>
<!--
  Myrlin Workbook logo reveal.

  Two jobs. It is the capture source for scripts/brand/build-logo-anim.js, which pauses
  every animation, steps currentTime frame by frame and screenshots; and it is a shippable
  animated logo for the landing site, since it is one self-contained file with no script
  and no external asset.

  Timing model: every animation shares one 2400ms duration and expresses its own phase in
  keyframe percentages. That is what makes the capture trivial. One `currentTime = t` on
  every animation puts the whole composition at time t, with no ordering to reconstruct.

  Motion: draw the outline on (brim, then crown, then tip), fill behind it, wipe the band
  in from the left, settle the two patches, fade the stitching in, then hold on the resting
  frame for the last 24 percent so the loop lands on a settled mark rather than mid-move.
  Easing is a plain ease-out with no overshoot; nothing bounces.

  Reduced motion: the media query removes every animation. Because the resting state is the
  elements' natural state and the animations only depart from it, removing them leaves the
  finished logo on screen rather than a blank box.
-->
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; height: 100%; }
  body {
    display: grid;
    place-items: center;
    background: #F9F8F7;
  }
  @media (prefers-color-scheme: dark) { body { background: #191919; } }
  svg { width: min(100vw, 100vh); height: min(100vw, 100vh); display: block; }

  /* Every animation shares this duration so one currentTime seeks the whole scene. */
  .anim {
    animation-duration: 2400ms;
    animation-timing-function: cubic-bezier(0.22, 0.61, 0.36, 1);
    animation-fill-mode: both;
    animation-iteration-count: infinite;
  }

  /* Outline draw-on. --len is written by the inline path-length pass below. */
  @keyframes draw {
    0%, 4%    { stroke-dashoffset: var(--len); }
    26%, 100% { stroke-dashoffset: 0; }
  }
  @keyframes drawCrown {
    0%, 14%   { stroke-dashoffset: var(--len); }
    38%, 100% { stroke-dashoffset: 0; }
  }
  @keyframes drawTip {
    0%, 26%   { stroke-dashoffset: var(--len); }
    48%, 100% { stroke-dashoffset: 0; }
  }

  /* Fills arrive behind the line that has just been drawn. */
  @keyframes fillBrim  { 0%, 16% { opacity: 0 } 32%, 100% { opacity: 1 } }
  @keyframes fillCrown { 0%, 26% { opacity: 0 } 42%, 100% { opacity: 1 } }
  @keyframes fillTip   { 0%, 36% { opacity: 0 } 52%, 100% { opacity: 1 } }

  /* Band wipes in from the left inside a fixed clip window. */
  @keyframes wipeBand {
    0%, 42%   { transform: translateX(-232px); }
    60%, 100% { transform: translateX(0); }
  }

  /* Patches settle: scale up to rest, no overshoot. */
  @keyframes settleA {
    0%, 54%   { opacity: 0; transform: scale(0.72); }
    66%, 100% { opacity: 1; transform: scale(1); }
  }
  @keyframes settleB {
    0%, 60%   { opacity: 0; transform: scale(0.72); }
    72%, 100% { opacity: 1; transform: scale(1); }
  }
  @keyframes fadeDetail { 0%, 68% { opacity: 0 } 80%, 100% { opacity: 1 } }

  #a-brim-line  { animation-name: draw; }
  #a-crown-line { animation-name: drawCrown; }
  #a-tip-line   { animation-name: drawTip; }
  #a-brim-fill  { animation-name: fillBrim; }
  #a-crown-fill { animation-name: fillCrown; }
  #a-tip-fill   { animation-name: fillTip; }
  #a-band       { animation-name: wipeBand; }
  #a-patch-a    { animation-name: settleA; transform-origin: 262px 166px; }
  #a-patch-b    { animation-name: settleB; transform-origin: 222px 282px; }
  #a-detail     { animation-name: fadeDetail; }

  @media (prefers-reduced-motion: reduce) {
    .anim { animation: none !important; }
  }
</style>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-28 -28 568 568" role="img" aria-label="Myrlin Workbook">
  <defs>
    <clipPath id="a-clip-brim"><use href="#a-brim-line"/></clipPath>
    <clipPath id="a-clip-crown"><use href="#a-crown-line"/></clipPath>
    <clipPath id="a-clip-tip"><use href="#a-tip-line"/></clipPath>
    <clipPath id="a-clip-bandwindow"><rect x="138" y="318" width="236" height="64"/></clipPath>
  </defs>

  <!-- Brim -->
  <g id="a-brim-fill" class="anim">
    <path fill="#5A437A" d="M152 355c-26 11-64 31-94 50L40 418c6 10 24 18 48 23 14 3 22 3 28 1 16 4 42 10 72 14 14 2 26 2 40 0 42-5 86-12 126-18 20-3 32-1 40 4 16 2 36-2 56-10L470 418c-14-16-48-36-80-48-12-5-20-11-26-15Z"/>
    <g clip-path="url(#a-clip-brim)">
      <path fill="#8E76A9" d="M16 384c58 36 134 56 250 62v40H16Z"/>
      <path fill="#35164B" d="M338 336c20 38 26 72 14 108h150V336Z"/>
      <path fill="#8E76A9" d="M300 438c16-22 44-31 72-25-6 17-28 29-72 25Z"/>
    </g>
  </g>
  <path id="a-brim-line" class="anim" fill="none" stroke="#221033" stroke-width="9" stroke-linejoin="round"
        d="M152 355c-26 11-64 31-94 50L40 418c6 10 24 18 48 23 14 3 22 3 28 1 16 4 42 10 72 14 14 2 26 2 40 0 42-5 86-12 126-18 20-3 32-1 40 4 16 2 36-2 56-10L470 418c-14-16-48-36-80-48-12-5-20-11-26-15Z"/>

  <!-- Crown -->
  <g id="a-crown-fill" class="anim">
    <path fill="#5A437A" d="M300 44c-14 12-44 26-60 36-12 7-19 19-20 41Q178 238 152 355h212c-14-55-32-123-48-183-5-18-4-33 0-48Z"/>
    <g clip-path="url(#a-clip-crown)">
      <path fill="#8E76A9" d="M300 44 246 118 180 372h-70V44Z"/>
      <path fill="#35164B" d="M266 84c10 56 32 146 58 288h80V84Z"/>
    </g>
  </g>
  <path id="a-crown-line" class="anim" fill="none" stroke="#221033" stroke-width="9" stroke-linejoin="round"
        d="M300 44c-14 12-44 26-60 36-12 7-19 19-20 41Q178 238 152 355h212c-14-55-32-123-48-183-5-18-4-33 0-48Z"/>

  <!-- Folded tip -->
  <g id="a-tip-fill" class="anim">
    <path fill="#5A437A" d="M300 44c14 14 38 40 56 74 12 22 20 42 20 60v12c0 12-1 19-3 23-11-14-24-35-34-55-8-16-16-27-23-34Z"/>
    <g clip-path="url(#a-clip-tip)">
      <path fill="#35164B" d="M288 102 400 148v134H288Z"/>
      <path fill="#8E76A9" d="M302 46c26 14 48 36 62 62l-14 8c-14-26-34-48-58-62Z"/>
    </g>
  </g>
  <path id="a-tip-line" class="anim" fill="none" stroke="#221033" stroke-width="9" stroke-linejoin="round"
        d="M300 44c14 14 38 40 56 74 12 22 20 42 20 60v12c0 12-1 19-3 23-11-14-24-35-34-55-8-16-16-27-23-34Z"/>

  <!-- Band, wiped in from the left inside a fixed window -->
  <g clip-path="url(#a-clip-bandwindow)">
    <g id="a-band" class="anim">
      <path fill="#4BEDB3" stroke="#221033" stroke-width="7" stroke-linejoin="round"
            d="M156 334c64-8 140-8 202-3 2 12 3 23 2 32-64 10-142 9-208-2 0-9 2-19 4-27Z"/>
      <path fill="#2CBA8B" d="M153 351c66 11 143 12 206 2l1 10c-64 10-142 9-208-2Z"/>
    </g>
  </g>

  <!-- Patches -->
  <rect id="a-patch-a" class="anim" x="237" y="141" width="50" height="50" rx="9" transform="rotate(-7 262 166)"
        fill="#4BEDB3" stroke="#221033" stroke-width="6"/>
  <rect id="a-patch-b" class="anim" x="194" y="254" width="56" height="56" rx="10" transform="rotate(6 222 282)"
        fill="#4BEDB3" stroke="#221033" stroke-width="6"/>

  <!-- Stitching, buckle and creases -->
  <g id="a-detail" class="anim">
    <rect x="247" y="151" width="30" height="30" rx="5" transform="rotate(-7 262 166)"
          fill="none" stroke="#221033" stroke-width="5" stroke-dasharray="8 7" stroke-linecap="round"/>
    <rect x="205" y="265" width="34" height="34" rx="6" transform="rotate(6 222 282)"
          fill="none" stroke="#221033" stroke-width="5" stroke-dasharray="9 8" stroke-linecap="round"/>
    <path fill="#221033" d="M302 331h13l1 34h-13Z"/>
    <path fill="none" stroke="#221033" stroke-width="6" stroke-linecap="round" stroke-opacity="0.45"
          d="M250 80c-6 26-10 52-11 74"/>
    <path fill="none" stroke="#221033" stroke-width="5" stroke-linecap="round" stroke-opacity="0.35"
          d="M198 240c-8 28-14 56-18 82"/>
  </g>
</svg>

<script>
  // Measure each outline once and hand the length to the keyframes as --len, so the
  // draw-on works off real path geometry instead of a guessed dash length.
  for (const id of ['a-brim-line', 'a-crown-line', 'a-tip-line']) {
    const el = document.getElementById(id);
    const len = Math.ceil(el.getTotalLength());
    el.style.setProperty('--len', len);
    el.style.strokeDasharray = len;
  }
  document.documentElement.dataset.ready = '1';
</script>
