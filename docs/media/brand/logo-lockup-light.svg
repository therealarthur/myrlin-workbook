<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 864 196" width="864" height="196" role="img" aria-label="Myrlin Workbook">
  <!--
    Myrlin Workbook horizontal lockup, for light grounds (README header, site header).
    Wordmark ink is #2C2C2B, the app's own primary text token in light.

    The mark is the #hat-core geometry from logo.svg at scale 0.35; #hat-detail is left
    out because at a header size of roughly 150px the stitching reads as noise beside
    76px type. Silhouette path data is byte identical to logo.svg.

    Type is live <text>, not outlines, so the file stays small and stays editable. Plus
    Jakarta Sans is named first and then a system stack: neither brand webfont is installed
    on the build machine and an SVG cannot fetch one, so a fallback is what will actually
    render nearly everywhere. Measured widths for "Myrlin Workbook" at 76px/600/-1.1:
    589px on the resolved stack, 599px on Arial. The 864 viewBox leaves headroom to about
    645px, so a wider fallback still fits inside the box.
  -->
  <defs>
    <clipPath id="myrlin-ll-brim"><use href="#ll-brim"/></clipPath>
    <clipPath id="myrlin-ll-crown"><use href="#ll-crown"/></clipPath>
    <clipPath id="myrlin-ll-tip"><use href="#ll-tip"/></clipPath>
  </defs>

  <g transform="translate(14 10) scale(0.35)">
    <path id="ll-brim" fill="#5A437A" stroke="#221033" stroke-width="9" stroke-linejoin="round"
          d="M152 355c-26 11-64 31-94 50L40 418c6 10 24 18 48 23 14 3 22 3 28 1 16 4 42 10 72 14 14 2 26 2 40 0 42-5 86-12 126-18 20-3 32-1 40 4 16 2 36-2 56-10L470 418c-14-16-48-36-80-48-12-5-20-11-26-15Z"/>
    <g clip-path="url(#myrlin-ll-brim)">
      <path fill="#8E76A9" d="M16 384c58 36 134 56 250 62v40H16Z"/>
      <path fill="#35164B" d="M338 336c20 38 26 72 14 108h150V336Z"/>
      <path fill="#8E76A9" d="M300 438c16-22 44-31 72-25-6 17-28 29-72 25Z"/>
    </g>
    <path id="ll-crown" fill="#5A437A" stroke="#221033" stroke-width="9" stroke-linejoin="round"
          d="M300 44c-14 12-44 26-60 36-12 7-19 19-20 41Q178 238 152 355h212c-14-55-32-123-48-183-5-18-4-33 0-48Z"/>
    <g clip-path="url(#myrlin-ll-crown)">
      <path fill="#8E76A9" d="M300 44 246 118 180 372h-70V44Z"/>
      <path fill="#35164B" d="M266 84c10 56 32 146 58 288h80V84Z"/>
    </g>
    <path id="ll-tip" fill="#5A437A" stroke="#221033" stroke-width="9" stroke-linejoin="round"
          d="M300 44c14 14 38 40 56 74 12 22 20 42 20 60v12c0 12-1 19-3 23-11-14-24-35-34-55-8-16-16-27-23-34Z"/>
    <g clip-path="url(#myrlin-ll-tip)">
      <path fill="#35164B" d="M288 102 400 148v134H288Z"/>
      <path fill="#8E76A9" d="M302 46c26 14 48 36 62 62l-14 8c-14-26-34-48-58-62Z"/>
    </g>
    <path fill="#4BEDB3" stroke="#221033" stroke-width="7" stroke-linejoin="round"
          d="M156 334c64-8 140-8 202-3 2 12 3 23 2 32-64 10-142 9-208-2 0-9 2-19 4-27Z"/>
    <path fill="#2CBA8B" d="M153 351c66 11 143 12 206 2l1 10c-64 10-142 9-208-2Z"/>
    <rect x="237" y="141" width="50" height="50" rx="9" transform="rotate(-7 262 166)"
          fill="#4BEDB3" stroke="#221033" stroke-width="6"/>
    <rect x="194" y="254" width="56" height="56" rx="10" transform="rotate(6 222 282)"
          fill="#4BEDB3" stroke="#221033" stroke-width="6"/>
  </g>

  <text x="229" y="127" fill="#2C2C2B" font-size="76" font-weight="600" letter-spacing="-1.1"
        font-family="'Plus Jakarta Sans', ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Display', 'Segoe UI', Helvetica, Arial, sans-serif">Myrlin Workbook</text>
</svg>
