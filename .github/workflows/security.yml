name: Security

# WHY: no automated security scanning existed before this. CodeQL catches
# common JavaScript vulnerability patterns (injection, unsafe regex, prototype
# pollution, etc.) on every push and PR against main, plus a weekly sweep to
# catch newly published query patterns against unchanged code. `npm audit`
# runs alongside it as an informational, non-blocking job: it flags known
# vulnerable dependency versions without gating merges, because audit
# findings are often in transitive dev-only packages that need a human to
# triage rather than a red X blocking every PR.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Every Monday 06:00 UTC. Catches new CodeQL query coverage landing
    # against code that has not otherwise changed that week.
    - cron: '0 6 * * 1'

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript']
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'

  npm-audit:
    runs-on: ubuntu-latest
    # Informational only: a known-vulnerability finding should not block a
    # merge on its own, since many are in transitive dependencies with no
    # available fix yet. continue-on-error sits on the STEP, not the job: a
    # job-level continue-on-error still paints the job's check red on the
    # commit (only the workflow conclusion is spared), which reads as a
    # failing build to anyone looking at the repo. The step-level form marks
    # the step as failed-but-continued, the job stays green, and the findings
    # land in the run's annotations and step summary where they are read.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: npm audit (production dependencies, high and above)
        id: audit
        continue-on-error: true
        run: |
          set +e
          npm audit --omit=dev --audit-level=high | tee audit.txt
          STATUS=${PIPESTATUS[0]}
          {
            echo "## npm audit (production, high and above)"
            echo
            echo '```'
            cat audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$STATUS" -ne 0 ]; then
            echo "::warning title=npm audit::npm audit found high or critical findings in production dependencies; see the step summary."
          fi
          exit "$STATUS"
