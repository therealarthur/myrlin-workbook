[package]
name = "remote-desktop"
version = "0.1.1"
edition = "2021"
description = "High-performance remote desktop server for macOS using CoreGraphics"

[[bin]]
name = "remote-desktop"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
tungstenite = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
core-graphics = { version = "0.24", features = ["highsierra"] }
core-foundation = "0.10"
futures-util = "0.3"
clap = { version = "4", features = ["derive", "env"] }
bytes = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
